<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>视觉页面中心多表同步</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>视觉页面中心多表同步</h1>
      </header>

      <section class="primary-action" aria-label="同步操作">
        <button id="syncButton" class="sync-button" type="button">同步</button>
      </section>

      <section class="status-panel" aria-labelledby="statusTitle">
        <h2 id="statusTitle">最近一次同步情况</h2>
        <div
          id="resultBox"
          class="status-text"
          role="status"
          aria-live="polite"
          aria-busy="false"
        >正在读取最近一次同步情况...</div>
        <progress id="progressBar" class="progress-bar" max="100" value="0" hidden></progress>
      </section>

      <button id="configButton" class="config-button" type="button">配置和规则</button>
    </main>

    <dialog id="configDialog" class="config-dialog" aria-labelledby="configTitle">
      <div class="dialog-header">
        <h2 id="configTitle">配置和规则</h2>
        <button
          id="closeConfigButton"
          class="close-button"
          type="button"
          aria-label="关闭"
          title="关闭"
        >&times;</button>
      </div>
      <div id="configContent" class="dialog-content">正在读取配置...</div>
    </dialog>

    <dialog id="conflictDialog" class="config-dialog conflict-dialog" aria-labelledby="conflictTitle">
      <div class="dialog-header">
        <h2 id="conflictTitle">冲突货号</h2>
        <button
          id="closeConflictButton"
          class="close-button"
          type="button"
          aria-label="关闭冲突货号"
          title="关闭"
        >&times;</button>
      </div>
      <div id="conflictContent" class="dialog-content"></div>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
